upstream speech_backend {
    zone speech_backend 64k;
    resolver 127.0.0.11 valid=10s;
    server back:3000 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header_inherit merge;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    location /api/ {
        client_max_body_size 11m;
        error_page 413 = @speech_upload_too_large;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 65s;
        proxy_pass http://speech_backend;
    }
    location @speech_upload_too_large {
        default_type application/json;
        return 413 '{"code":"FILE_TOO_LARGE"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /models/furniture/ {
        types { model/gltf-binary glb; }
        try_files $uri =404;
    }
    location /furniture-model/ {
        try_files $uri =404;
    }
    location ~ ^/assets/.+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
